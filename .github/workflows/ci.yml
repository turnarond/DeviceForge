name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-2022   # 钉版本：windows-latest 已切到 windows-2025-vs2026 镜像（无 VS2022 实例）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/devtools/versioncheck.py

  cpp:
    name: Qt 6.9.2 / ${{ matrix.configuration }}
    runs-on: windows-2022   # 同上：CMake 生成器串 "Visual Studio 17 2022" 需要 VS2022 实例
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtserialport qtserialbus qtwebsockets'
          cache: true
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
