name: DIAG ws_page_layout（一次性取证，不合回）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 屏几何与显卡（验证 resize 是否被 WM 钳到小屏）
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "PrimaryScreen: $($b.Width)x$($b.Height) workarea=$([System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea.Width)x$([System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea.Height)"
          Get-CimInstance Win32_VideoController | ForEach-Object { "VC: $($_.Name) $($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtserialport qtserialbus qtwebsockets'
          cache: true
      - name: configure（只配测试需要的东西，走全量配置）
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: build 单目标
        run: cmake --build build --config Release --target tst_ws_page_layout
      - name: 跑目标并把落盘输出打出来（崩了也能看到写到哪一格）
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$PWD\build\Release;$env:PATH"
          & .\build\Release\tst_ws_page_layout.exe -o diag-out.txt,txt
          "EXITCODE=$LASTEXITCODE"
          if (Test-Path diag-out.txt) { "BYTES=" + (Get-Item diag-out.txt).Length; Get-Content diag-out.txt -Encoding UTF8 -Tail 60 } else { "NO OUTPUT FILE" }
      - name: ctest -V 取退出码
        if: always()
        run: ctest --test-dir build -C Release -R tst_ws_page_layout -V
